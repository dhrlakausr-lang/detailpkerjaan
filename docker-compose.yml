services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_NAME: LokerinAja
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: lokerinaja
      DB_USERNAME: root
      DB_PASSWORD: root
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      # === Konfigurasi Gmail SMTP untuk kirim OTP ===
      # Ganti MAIL_USERNAME & MAIL_PASSWORD dengan email Gmail dan App Password kamu.
      # App Password dibuat di: https://myaccount.google.com/apppasswords (butuh 2FA aktif).
      MAIL_MAILER: smtp
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: "587"
      MAIL_ENCRYPTION: tls
      MAIL_USERNAME: "emailkamu@gmail.com"
      MAIL_PASSWORD: "app-password-16-huruf"
      MAIL_FROM_ADDRESS: "emailkamu@gmail.com"
      MAIL_FROM_NAME: LokerinAja
    depends_on:
      - db

  db:
    image: mysql:8.4
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lokerinaja
    volumes:
      - lokerinaja-db:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:5
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - db

volumes:
  lokerinaja-db:
